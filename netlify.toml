# Netlify deployment settings for the Woodora Kitchens site

[build]
  command = "npx prisma generate && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's Next.js runtime handles the build output on its own
  NEXT_OUTPUT = "default"
  # The live site has no persistent SQLite database. The contact form still
  # works: submissions fall back to the Netlify function log (see
  # src/app/api/contact/route.ts). Connect a hosted database later if you
  # want enquiries stored permanently.
  DATABASE_URL = "file:/tmp/woodora-ephemeral.db"

[[plugins]]
  package = "@netlify/plugin-nextjs"
